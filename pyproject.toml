[project]
name = "macaistudio-engine"
version = "1.0.0-rc18"
description = "MacAIStudio Local AI Engine - FastAPI server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.120",
    "uvicorn[standard]>=0.32.0,<0.35",
    "python-multipart>=0.0.9",
    "huggingface_hub>=0.26.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "httpx>=0.27.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "accelerate>=0.33.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
# Qwen3-TTS 本地模型（可选）。因 qwen-tts 依赖链 librosa->numba->llvmlite 在 Python 3.12+ 有兼容问题，
# 默认不安装。需要时运行: uv sync --extra qwen-tts（建议使用 Python 3.10/3.11）
qwen-tts = ["qwen-tts>=0.1.0"]

[tool.uv]
