    "uvicorn[standard]>=0.32.0,<0.35",
    "python-multipart>=0.0.9",
    "huggingface_hub>=0.26.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "httpx>=0.27.0",
    "transformers[torch]>=5.5.0,<6",
    "torch>=2.0.0",
    "accelerate>=0.33.0",
